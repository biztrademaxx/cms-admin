query GetLeadsGroupedByField($input: GroupLeadsInput!) {
  getLeadsGroupedByField(input: $input) {
    count
    group
    leads {
      awardCategory
      companyName
      createdAt
      email
      industry
      jobTitle
      leadType
      message
      name
      phone
      price
      projectId
      quantity
      status
      utmId
    }
  }
}
