query GetPartnersByProject($input:GetPartnersByProjectInput!) {
  getPartnersByProject(input:$input) {
    address
    boothNumber
    contactEmail
    contactName
    contactTitle
    createdAt
    description
    facebookUrl
    featured
    hideFromParticipant
    id
    instagramUrl
    linkedinUrl
    logoUrl
    name
    partnerType
    phone
    projectId
    seqNo
    status
    website
    xUrl
    youtubeUrl
  }
}
