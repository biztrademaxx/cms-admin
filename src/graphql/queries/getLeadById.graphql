query GetLeadById($id: String!) {
  getLeadById(id: $id) {
    id
    projectId
    assignedToId
    name
    email
    additionalEmails
    phone
    additionalPhones
    companyName
    jobTitle
    contactPersonName
    contactPersonPhone
    contactPersonDesignation
    contactPersonEmail
    city
    state
    country
    industry
    status
    source
    leadType
    message
    notes
    quantity
    price
    assignedToId
    callbackDate
    followUpDate
    createdAt
    updatedAt
    visitorPass {
      externalPassId
      registrationNumber
      publicCode
      passUrl
      badgeUrl
      qrPayload
      status
      channel
      countryCode
      nationalNumber
      area
      pinCode
      registrationSource
      badgeDesign
      sentVia
      sentStatus
      interests
      eventName
      eventDates
      eventVenue
      verifiedAt
      issuedAt
      sentAt
      checkedInAt
      sourceUpdatedAt
      id
      syncedAt
    }
    assignedTo {
      id
      name
      email
      phone
      cities {
        city
        state
      }
    }
    utm {
      id
      source
      medium
      campaign
      term
      content
      url
    }
  }
}
