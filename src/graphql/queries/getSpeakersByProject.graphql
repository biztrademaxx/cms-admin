query getSpeakersByProject($projectId: String!) {
    getSpeakersByProject(projectId: $projectId) {
        companyLogo
        companyName
        createdAt
        designation
        facebookUrl
        hideFromParticipant
        id
        image
        instagramUrl
        linkedinUrl
        name
        projectId
        seqNo
        status
        updatedAt
        website
        xUrl
        youtubeUrl
        description

    }
}