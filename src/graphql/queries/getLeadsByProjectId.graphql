query GetLeadsByProjectId($projectId: String!) {
  getLeadsByProjectId(projectId: $projectId) {
    id
    awardCategory
    companyName
    createdAt
    email
    industry
    jobTitle
    leadType
    message
    name
    phone
    price
    projectId
    quantity
    status
    source
    city
    state
    country
    notes
    assignedToId
    utmId
    assignedTo {
      id
      name
      email
    }
    utm {
      source
      medium
      campaign
    }
  }
}
