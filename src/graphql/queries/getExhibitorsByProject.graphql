query GetExhibitorsByProject($projectId: String!) {
  getExhibitorsByProject(projectId: $projectId) {
        address
        boothNumber
        companyName
        contactEmail
        contactName
        contactTitle
        createdAt
        description
        hideFromParticipant
        id
        linkedinUrl
        logoUrl
        projectId
        seqNo
        status
        updatedAt
        website
  }
}
