query GetUtmByProjectId($id: String!, $input: GroupLeadsInput!) {
  getUtmByProject(id: $id) {
    campaign
    content
    createdAt
    id
    medium
    projectId
    source
    term
    url
  }
  getLeadsGroupedByField(input: $input) {
    field
    groups {
      avgPrice
      count
      group
      totalPrice
      leads {
        email
      }
    }
  }
}
